services:
  - type: web
    name: sdpms-backend
    runtime: docker
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: AUTO_SEED
        value: true
      - key: SEED_ADMIN_PASSWORD
        value: admin123

  - type: web
    name: sdpms-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://ai-based-desktop-pooling-system-1.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
